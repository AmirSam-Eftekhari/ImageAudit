name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[api,dev]"
      - run: ruff check .
      - run: pytest -q
      - name: CI gate smoke test (sample dataset must fail validation)
        shell: bash
        run: |
          set +e
          imageaudit validate ../examples/sample_dataset
          test $? -eq 1
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  windows-exe:
    # Builds dist/ImageAudit.exe and runs packaging/smoke_test.py against it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: .\scripts\dev.ps1 setup
      - run: .\scripts\dev.ps1 build-exe
      - uses: actions/upload-artifact@v4
        with: { name: ImageAudit-windows, path: dist/ImageAudit.exe }
